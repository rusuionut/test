# Raport de evaluare functionala — Terapie Craniosacrala.
#
# Structura urmeaza raportul redactat manual: observatii (extrase din dictare,
# fiecare cu citat verificat) urmate de doua sectiuni deduse (directii de lucru,
# consecinte functionale), marcate ca atare in document.
#
# Tot ce e vizibil in raport (titluri, etichete, descrieri) se scrie cu diacritice:
# textul acesta ajunge ca atare in documentul trimis clientului.
#
# Tipuri: string | text | integer | number | boolean | date | list | table
# mode: observed (implicit, cere citat din inregistrare) | derived (dedus)

name: Raport de evaluare funcțională și observații din ședință
specialty: Terapie Craniosacrală
language: ro
version: "1"

sections:
  - id: context
    title: Date generale
    fields:
      - id: nume_client
        label: Client
        type: string
        required: true
      - id: data_sedintei
        label: Data ședinței
        type: date
        required: true
      - id: tip_sedinta
        label: Tipul ședinței
        type: string
        description: Ex. Terapie Craniosacrală, evaluare posturală.
      - id: numar_sedinta
        label: Numărul ședinței
        type: integer
      - id: terapeut
        label: Terapeut
        type: string
      - id: istoric_relatat
        label: Aspecte relatate de client
        type: list
        description: >
          Ce a confirmat sau a relatat clientul în timpul ședinței (simptome,
          episoade anterioare, obiceiuri). Doar ce a spus clientul, nu ce s-a palpat.

  - id: observatii_generale
    title: Observații generale
    fields:
      - id: tonus_general
        label: Tonus muscular general
        type: string
      - id: respiratie
        label: Model respirator
        type: string
        description: Tipul de respirație observat în decubit (abdominală, toracică, mixtă).
      - id: alte_observatii_generale
        label: Alte observații generale
        type: text

  - id: fascial
    title: Observații fasciale și miofasciale
    description: Trasee de tensiune identificate prin tehnici de evaluare fascială.
    fields:
      - id: traseu_tensiune
        label: Traseul principal de tensiune
        type: text
        description: >
          Descrierea traseului fascial tensionat, în ordinea în care a fost palpat
          (punct de plecare, direcție, zone traversate).
      - id: zone_tensionate
        label: Zone cu tensiune crescută
        type: list
        description: Regiunile anatomice unde s-a perceput tensiune fascială crescută.
      - id: corelatii_simptome
        label: Corelații cu simptomele relatate
        type: text
        description: Legăturile observate între zonele tensionate și ce a confirmat clientul.

  - id: visceral
    title: Zona abdominală și viscerală
    fields:
      - id: observatii_colon
        label: Traseul colonului
        type: text
      - id: cicatrici
        label: Cicatrici
        type: table
        columns:
          - id: localizare
            label: Localizare
          - id: tip
            label: Proveniență
          - id: caracteristici
            label: Caracteristici fasciale
      - id: alte_observatii_viscerale
        label: Alte observații viscerale
        type: text

  - id: bazin
    title: Bazin
    fields:
      - id: mobilitate_bazin
        label: Mobilitatea bazinului
        type: text
      - id: articulatii_sacroiliace
        label: Articulațiile sacroiliace
        type: string

  - id: membre_inferioare
    title: Membre inferioare și sprijin plantar
    fields:
      - id: musculatura_hipertona
        label: Musculatură hipertonă
        type: list
      - id: musculatura_hipotona
        label: Musculatură hipotonă
        type: list
      - id: fascia_plantara
        label: Fascia plantară
        type: string
      - id: tendon_ahilian
        label: Tendonul ahilian
        type: string
      - id: arc_transversal
        label: Arc plantar transversal
        type: string
      - id: arc_longitudinal
        label: Arc longitudinal intern
        type: string
      - id: deformari_degete
        label: Deformări ale degetelor
        type: string
      - id: alte_observatii_membre
        label: Alte observații
        type: text

  - id: lanturi
    title: Lanțuri musculare
    fields:
      - id: lant_posterior
        label: Lanțul muscular posterior
        type: string
      - id: alte_lanturi
        label: Alte lanțuri implicate
        type: text

  # --- de aici in jos: continut formulat de model, nu constatat in sedinta ---

  - id: directii_de_lucru
    title: Direcții de lucru terapeutic
    mode: derived
    description: Priorități propuse pentru ședințele următoare, pe baza observațiilor de mai sus.
    fields:
      - id: prioritati
        label: Priorități pentru ședințele următoare
        type: list
        required: true
        description: >
          Direcții concrete de intervenție, formulate ca acțiuni terapeutice
          (ex. „normalizarea tensiunilor fasciale cranio-cervicale"). Fiecare
          direcție trebuie să corespundă unei observații consemnate în raport.
      - id: recomandari_client
        label: Recomandări pentru client între ședințe
        type: list
        description: >
          Sugestii pe care clientul le poate aplica singur (mobilitate, hidratare,
          respirație). Fără indicații medicamentoase și fără restricții medicale.

  - id: consecinte
    title: Posibile consecințe funcționale
    mode: derived
    description: Ce pot antrena în timp dezechilibrele observate, dacă persistă.
    fields:
      - id: consecinte_posibile
        label: Consecințe posibile în absența intervenției
        type: list
        required: true
        description: >
          Formulare prudentă, la nivel funcțional („poate contribui la",
          „poate favoriza"). Nu prognostic medical, nu afirmații de cauzalitate certă.

disclaimer: >
  Raport generat automat dintr-o înregistrare audio. Necesită verificarea și
  asumarea terapeutului înainte de a fi transmis clientului.

footer: |
  Aceste observații nu reprezintă un diagnostic medical. Ele descriu modul în care
  organismul funcționează și se adaptează în prezent. Obiectivul terapiei este
  reducerea progresivă a tensiunilor, îmbunătățirea mobilității și restabilirea unui
  echilibru funcțional cât mai eficient.
